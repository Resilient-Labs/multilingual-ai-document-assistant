name: Build TTS Inference Images

on:
  push:
    paths:
      - 'infra/tts-handlers/**'
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build-en:
    name: Build English (coqui-vctk-en)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/resilient-labs/coqui-vctk-en-inference
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: infra/tts-handlers/en
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-es:
    name: Build Spanish (coqui-css10-es)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
