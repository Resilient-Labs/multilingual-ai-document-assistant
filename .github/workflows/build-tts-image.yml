      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: infra/tts-handlers/es
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

  build-vi:
    name: Build Vietnamese (mms-tts-vie)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/resilient-labs/mms-tts-vie-inference
          tags: |
            type=sha,prefix=sha-
